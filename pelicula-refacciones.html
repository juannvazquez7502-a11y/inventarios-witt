<!doctype html>
<html lang="es-MX">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Cada pieza cuenta · Grupo Witt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Shell AUTOS "Cada pieza cuenta" · motor FILM + reproductor (17-nov-2026; copia de shell_v3 de la película de Inventario físico).
   Tiempos: TODO sale de window.TA (tiempos_autos.js, primer script de las escenas): FILM.dur = TA.dur; escenas s1–s17. ===== */
:root{
  --witt:#009878; --menta:#2bc8a4; --menta2:#3fd8b2; --prof:#00574a; --noche:#00201a; --ink:#0b1f1a;
  --glass:rgba(12,20,18,.72); --glass-line:rgba(255,255,255,.10);
  --ui-ease:cubic-bezier(.22,1,.36,1); --ui-spring:cubic-bezier(.34,1.56,.64,1);
  --font:'Montserrat',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#film-root{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#film-root.is-idle{cursor:none}

/* Escenario lógico (1920x1080 o 1080x1920), escalado con transform */
#film-stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#000;contain:layout paint style}
.film-layer{position:absolute;inset:0;overflow:hidden}
.film-layer[hidden]{display:none}

/* Subtítulos (dentro del escenario: escalan con la película) */
#film-subs{position:absolute;left:0;right:0;bottom:40px;z-index:9000;display:flex;justify-content:center;pointer-events:none;
  transition:transform .32s var(--ui-ease)}
#film-subs .fs-line{max-width:1500px;padding:14px 30px 16px;border-radius:22px;
  font-weight:600;font-size:max(42px,var(--film-submin,0px));line-height:1.18;letter-spacing:-.012em;text-align:center;text-wrap:balance;color:#fff;
  background:rgba(0,20,16,.56);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 18px 40px -18px rgba(0,87,74,.7);
  opacity:0;transition:none}
#film-subs.is-on .fs-line{opacity:1}
.is-vertical #film-subs{bottom:90px}
#film-subs.is-top{transform:none!important}
/* AUTOS 18-nov (crítica 2): con la película corriendo (is-idle) el subtítulo SIEMPRE va en su sitio (y 84–97 %),
   aunque la subida para dejar ver los controles se haya quedado puesta: solo sube mientras se ven los controles */
#film-root.is-idle #film-subs{transform:none!important}
/* AUTOS 18-nov: la regla tit-on que ocultaba el subtítulo se quitó: el subtítulo SIEMPRE se ve (abajo) */
.is-vertical #film-subs.is-low{bottom:56px}
.is-vertical #film-subs .fs-line{max-width:980px;font-size:max(56px,var(--film-submin,0px));padding:18px 34px 20px;border-radius:28px}

/* Marco en pantalla (mismo rectángulo que el escenario ya escalado) */
#film-frame{position:absolute;z-index:2;container-type:size;container-name:frame}

/* ---------- Póster ---------- */
.film-poster{position:absolute;inset:0;overflow:hidden;z-index:5;color:#fff;
  background:linear-gradient(125deg,#00201a,#00574a 42%,#009878 74%,#3fd8b2);
  transition:opacity .45s var(--ui-ease),transform .6s var(--ui-ease),filter .45s var(--ui-ease)}
.film-poster.is-leaving{opacity:0;transform:scale(1.06);filter:blur(6px);pointer-events:none}
.film-poster[hidden]{display:none}
.fp-art{position:absolute;inset:0;width:100%;height:100%}
.fp-art .fp-route{stroke-dasharray:1260;stroke-dashoffset:1260;animation:fp-draw 3.2s .35s var(--ui-ease) forwards}
.fp-art .fp-pin{transform-box:fill-box;transform-origin:50% 50%;animation:fp-pulse 2.4s 2.6s ease-out infinite}
@keyframes fp-draw{to{stroke-dashoffset:0}}
@keyframes fp-pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.fp-grain{position:absolute;inset:-50%;opacity:.16;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.fp-vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(150% 100% at 22% 100%,rgba(0,20,16,.82),rgba(0,20,16,0) 66%),radial-gradient(60% 60% at 82% 18%,rgba(63,216,178,.28),rgba(63,216,178,0) 70%)}
.fp-logo{position:absolute;left:5.2cqw;top:5.2cqh;height:clamp(30px,11cqh,104px);width:auto;
  filter:drop-shadow(0 10px 24px rgba(0,32,26,.45))}
.fp-copy{position:absolute;left:5.2cqw;right:calc(10cqw + clamp(64px,17cqmin,176px));bottom:7cqh}
.fp-kicker{display:inline-flex;align-items:center;gap:.6em;font-weight:600;font-size:clamp(11px,1.55cqw,22px);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.fp-kicker::before{content:"";width:.62em;height:.62em;border-radius:50%;background:var(--menta2);box-shadow:0 0 0 .3em rgba(63,216,178,.22)}
.fp-title{margin-top:.18em;font-weight:800;font-size:clamp(28px,6.6cqw,128px);line-height:.92;max-width:13.5em;letter-spacing:-.045em;
  font-variation-settings:"opsz" 96;text-wrap:balance;text-shadow:0 18px 50px rgba(0,32,26,.35)}
.fp-title em{font-style:normal;background:linear-gradient(100deg,#fff 0%,#d9fff4 45%,#b4f3e2 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.fp-meta{margin-top:1.1em;display:flex;flex-wrap:wrap;gap:.5em;font-weight:600;font-size:clamp(11px,1.35cqw,19px);font-variant-numeric:tabular-nums}
.fp-meta span{padding:.42em .95em;border-radius:999px;background:rgba(255,255,255,.95);color:var(--ink);
  box-shadow:0 8px 22px -10px rgba(0,87,74,.75)}
.fp-meta span.is-soft{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.fp-play{position:absolute;right:7cqw;bottom:9cqh;width:clamp(64px,17cqmin,176px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;color:var(--ink);background:#fff;
  box-shadow:0 24px 60px -18px rgba(0,32,26,.85),0 0 0 clamp(6px,1.2cqmin,14px) rgba(255,255,255,.16),inset 0 -6px 14px rgba(0,87,74,.14);
  transition:transform .22s var(--ui-ease),box-shadow .22s var(--ui-ease)}
.fp-play svg{width:36%;height:36%;margin-left:8%}
.fp-play::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:fp-ring 2.6s 1.2s ease-out infinite;pointer-events:none}
@keyframes fp-ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.55);opacity:0}}
.fp-play:hover{transform:scale(1.045);box-shadow:0 30px 70px -18px rgba(0,32,26,.9),0 0 0 clamp(8px,1.5cqmin,18px) rgba(63,216,178,.28),inset 0 -6px 14px rgba(0,87,74,.14)}
.fp-play:active{transform:scale(.97)}
@container frame (aspect-ratio < 1){
  .fp-logo{height:clamp(30px,7cqh,120px);left:7cqw;top:5cqh}
  .fp-copy{left:7cqw;right:7cqw;bottom:calc(10cqh + clamp(64px,17cqmin,176px))}
  .fp-title{font-size:clamp(30px,11.2cqw,132px)}
  .fp-kicker{font-size:clamp(11px,2.9cqw,30px)}
  .fp-meta{font-size:clamp(11px,2.6cqw,26px)}
  .fp-play{right:auto;left:50%;bottom:6.5cqh;margin-left:calc(clamp(64px,17cqmin,176px) / -2)}
}

/* ---------- Controles (estilo Apple: panel de vidrio flotante) ---------- */
/* Si el marco es muy angosto (vertical en ventana baja), el panel sale al letterbox negro en vez de amontonarse */
.film-ctrl{position:absolute;left:50%;bottom:clamp(8px,2.2cqh,22px);width:min(max(calc(100% - 24px),min(360px,calc(100vw - 24px))),820px);z-index:6;
  display:grid;grid-template-columns:auto auto 1fr auto auto auto;grid-template-areas:"scrub scrub scrub scrub scrub scrub" "play time gap snd fmt fs";
  align-items:center;column-gap:2px;padding:2px 8px 6px;border-radius:20px;
  background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 0 0 1px var(--glass-line),0 22px 50px -20px rgba(0,87,74,.75);
  transform:translateX(-50%);transition:opacity .26s var(--ui-ease),transform .32s var(--ui-ease)}
#film-root.is-idle .film-ctrl,#film-root.has-poster .film-ctrl{opacity:0;transform:translate(-50%,14px);pointer-events:none}
.fc-btn{grid-row:2;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;
  transition:transform .16s var(--ui-ease),background-color .16s linear,color .16s linear}
.fc-btn svg{width:22px;height:22px}
.fc-btn:hover{background:rgba(255,255,255,.10)}
.fc-btn:active{transform:scale(.92)}
.fc-btn[aria-disabled="true"]{color:rgba(255,255,255,.42);cursor:not-allowed}
.fc-btn[aria-disabled="true"]:hover{background:none}
.fc-play{grid-area:play}.fc-snd{grid-area:snd}.fc-fmt{grid-area:fmt}.fc-fs{grid-area:fs}
.fc-time{grid-area:time;padding:0 8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap;color:#fff}
.fc-time .fc-of{color:rgba(255,255,255,.62);font-weight:500}
.fc-scrub{grid-area:scrub;position:relative;height:30px;margin:0 6px;cursor:pointer;touch-action:none;outline:none;border-radius:8px}
.fc-track{position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.22);
  transition:transform .2s var(--ui-ease)}
.fc-fill{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--menta),var(--menta2))}
.fc-rail{position:absolute;left:0;right:0;top:50%;height:0;transform:translateX(0);pointer-events:none}
.fc-thumb{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 4px rgba(63,216,178,.35),0 4px 10px rgba(0,0,0,.4);transform:scale(.5);transition:transform .2s var(--ui-spring)}
.fc-scrub:hover .fc-track,.fc-scrub.is-drag .fc-track,.fc-scrub:focus-visible .fc-track{transform:scaleY(1.7)}
.fc-scrub:hover .fc-thumb,.fc-scrub.is-drag .fc-thumb,.fc-scrub:focus-visible .fc-thumb{transform:scale(1)}
.fc-tip{position:absolute;left:0;bottom:100%;margin-bottom:6px;padding:4px 9px;border-radius:9px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--ink);background:#fff;box-shadow:0 8px 20px -8px rgba(0,87,74,.8);opacity:0;pointer-events:none;transition:opacity .15s linear;white-space:nowrap}
.fc-scrub:hover .fc-tip,.fc-scrub.is-drag .fc-tip{opacity:1}
.fc-btn:focus-visible,.fc-scrub:focus-visible,.fp-play:focus-visible,.film-end button:focus-visible{outline:3px solid var(--menta2);outline-offset:3px}
@container frame (max-height: 360px){
  .fp-logo{height:clamp(22px,11cqh,104px);top:4cqh}
  .fp-meta{margin-top:.6em;gap:.35em}
  .fp-meta span{padding:.3em .75em}
}
@container frame (max-height: 320px){
  .film-ctrl{grid-template-columns:auto auto 1fr auto auto auto;grid-template-areas:"play time scrub snd fmt fs";padding:4px 6px;border-radius:16px}
  .fc-btn{grid-row:1}
  .fc-time .fc-of{display:none}
}

/* Destello central al pausar/reanudar */
.film-flash{position:absolute;left:50%;top:50%;width:clamp(56px,13cqmin,120px);aspect-ratio:1;margin:calc(clamp(56px,13cqmin,120px) / -2) 0 0 calc(clamp(56px,13cqmin,120px) / -2);
  border-radius:50%;display:grid;place-items:center;z-index:4;pointer-events:none;opacity:0;
  background:rgba(16,22,20,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--glass-line)}
.film-flash svg{width:40%;height:40%}

/* Final: volver a ver */
.film-end{position:absolute;inset:0;z-index:4;display:grid;place-items:end center;padding-bottom:max(118px,16cqh);pointer-events:none;opacity:0;transition:opacity .35s var(--ui-ease)}
#film-root.is-ended .film-end{opacity:1}
#film-root.is-ended .film-end button{pointer-events:auto}
.film-end button{display:inline-flex;align-items:center;gap:.55em;min-height:48px;padding:.75em 1.4em .75em 1.15em;border-radius:999px;
  font-weight:700;font-size:clamp(14px,2.2cqmin,22px);color:var(--ink);background:#fff;white-space:nowrap;
  box-shadow:0 20px 50px -16px rgba(0,32,26,.9),0 0 0 8px rgba(255,255,255,.14);transition:transform .2s var(--ui-ease)}
.film-end button:hover{transform:scale(1.04)}
.film-end button:active{transform:scale(.97)}
.film-end svg{width:1.25em;height:1.25em}
/* AUTOS 18-nov: en horizontal el lema del cuadro final ocupa x 37–63 %, y≈77–81 %, y entre el lema y el panel de controles
   no cabe el botón en marcos de 720 px. El botón va abajo a la DERECHA, justo arriba del panel (bottom clamp(8px,2.2cqh,22px)
   + ≈82 px de alto): no se encima ni con el lema ni con los controles. En vertical se queda como estaba (bajo el lema, sin encimarse). */
@container frame (aspect-ratio >= 1){
  .film-end{place-items:end end;padding-right:5cqw;padding-bottom:calc(clamp(8px,2.2cqh,22px) + 96px)}
}

@media (prefers-reduced-motion: reduce){
  .fp-art .fp-route{animation:none;stroke-dashoffset:0}
  .fp-art .fp-pin,.fp-play::after{animation:none}
  .film-poster,.film-ctrl,#film-subs{transition-duration:.01s}
}
</style>
</head>
<body>
<div id="film-root" class="has-poster">
  <div id="film-stage" aria-hidden="true">
    <div id="film-layers"></div>
    <div id="film-subs"><div class="fs-line" id="film-subline"></div></div>
  </div>

  <div id="film-frame" role="region" aria-label="Reproductor de la película Cada pieza cuenta" aria-describedby="film-desc">
    <p id="film-desc" class="sr-only"></p>

    <div class="film-flash" id="film-flash" aria-hidden="true"></div>

    <div class="film-end" id="film-end">
      <button type="button" id="film-replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v5h5"/></svg>Volver a ver</button>
    </div>

    <div class="film-poster" id="film-poster">
      <div class="fp-vignette" aria-hidden="true"></div>
      <svg class="fp-art" id="fp-art" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <pattern id="fp-iso" width="120" height="69.28" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)">
            <path d="M0 0L120 69.28M120 0L0 69.28" stroke="rgba(255,255,255,.09)" stroke-width="1.4" fill="none"/>
          </pattern>
          <radialGradient id="fp-fade" cx="72%" cy="40%" r="75%">
            <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <mask id="fp-mask"><rect width="1920" height="1080" fill="url(#fp-fade)"/></mask>
        </defs>
        <rect width="1920" height="1080" fill="url(#fp-iso)" mask="url(#fp-mask)"/>
        <g transform="translate(1380 470) scale(1 .57735) rotate(45)">
          <rect x="-560" y="-330" width="1000" height="660" rx="36" fill="rgba(0,32,26,.20)"/>
          <path d="M-460 -300V-90M-460 90V300M-340 -300V-90M-340 90V300M-220 -300V-90M-220 90V300M-100 -300V-90M-100 90V300M20 -300V-90M20 90V300M140 -300V-90M140 90V300M260 -300V-90M260 90V300M380 -300V-90M380 90V300M500 -300V-90M500 90V300" stroke="rgba(255,255,255,.30)" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M-520 0H420" stroke="rgba(255,255,255,.16)" stroke-width="5" stroke-dasharray="34 30" fill="none"/>
          <g><rect x="-440" y="-275" width="80" height="170" rx="26" fill="rgba(0,32,26,.34)"/><rect x="-430" y="-232" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="-320" y="-275" width="80" height="170" rx="26" fill="rgba(255,255,255,.20)"/><rect x="-310" y="-232" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="-80" y="-275" width="80" height="170" rx="26" fill="rgba(255,255,255,.20)"/><rect x="-70" y="-232" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="40" y="-275" width="80" height="170" rx="26" fill="rgba(0,32,26,.34)"/><rect x="50" y="-232" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="160" y="-275" width="80" height="170" rx="26" fill="rgba(255,255,255,.20)"/><rect x="170" y="-232" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="400" y="-275" width="80" height="170" rx="26" fill="rgba(255,255,255,.20)"/><rect x="410" y="-232" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="-440" y="105" width="80" height="170" rx="26" fill="rgba(255,255,255,.20)"/><rect x="-430" y="148" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="-320" y="105" width="80" height="170" rx="26" fill="rgba(0,32,26,.34)"/><rect x="-310" y="148" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="-200" y="105" width="80" height="170" rx="26" fill="rgba(255,255,255,.20)"/><rect x="-190" y="148" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="-80" y="105" width="80" height="170" rx="26" fill="rgba(0,32,26,.34)"/><rect x="-70" y="148" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="40" y="105" width="80" height="170" rx="26" fill="rgba(255,255,255,.20)"/><rect x="50" y="148" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
          <g><rect x="160" y="105" width="80" height="170" rx="26" fill="#ffffff"/><rect x="170" y="148" width="60" height="74" rx="16" fill="rgba(0,87,74,.55)"/></g>
          <g><rect x="400" y="105" width="80" height="170" rx="26" fill="rgba(0,32,26,.34)"/><rect x="410" y="148" width="60" height="74" rx="16" fill="rgba(255,255,255,.12)"/></g>
        </g>
        <g fill="none" stroke-linejoin="round" stroke-linecap="round" transform="translate(1380 470) scale(1 .57735) rotate(45)">
          <path d="M-520 0H220V96" stroke="rgba(0,32,26,.35)" stroke-width="30" transform="translate(10 10)"/>
          <path class="fp-route" pathLength="1260" d="M-520 0H220V96" stroke="#3fd8b2" stroke-width="20"/>
        </g>
        <g transform="translate(1404.7 565.3)">
          <circle class="fp-pin" r="22" fill="none" stroke="#fff" stroke-width="4"/>
          <circle r="16" fill="#fff"/><circle r="7" fill="#009878"/>
        </g>
      </svg>
      <div class="fp-grain" aria-hidden="true"></div>
      <img class="fp-logo" id="fp-logo" alt="Grupo Witt">
      <div class="fp-copy">
        <p class="fp-kicker">Inventarios · Refacciones · Grupo Witt</p>
        <h1 class="fp-title">Cada pieza <em>cuenta</em></h1>
        <p class="fp-meta"><span id="fp-dur">1:28</span><span class="is-soft" id="fp-sound">Con música y subtítulos</span><span class="is-soft" id="fp-format">Horizontal 16:9</span></p>
      </div>
      <button type="button" class="fp-play" id="fp-play" aria-label="Reproducir la película Cada pieza cuenta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.8v16.4c0 .8.9 1.3 1.6.9l13-8.2c.6-.4.6-1.4 0-1.8l-13-8.2C6.9 2.5 6 3 6 3.8z" fill="currentColor"/></svg>
      </button>
