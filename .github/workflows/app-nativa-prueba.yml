name: App nativa (prueba en emulador)

# PRUEBA, no publica nada: arma un APK de depuración que abre la copia de prueba /prueba-nativa/ (la página CON nativa.js)
# y lo prueba en un emulador con toques reales (adb input), capturas (screencap) y lectura de pantalla (uiautomator).
# También instala el APK TWA y encima la app nativa firmada del Release, para ver que se actualiza con la misma llave.
# No toca index.html, apk.yml ni app-nativa.yml. *.supabase.co bloqueado por DNS: solo datos sintéticos.
# prueba = critica: escáner, atrás, sin red y actualización encima del TWA (app-nativa-prueba/critica.sh).
# prueba = qr: ligas para unirse con la CÁMARA del teléfono (App Link, app-nativa-prueba/qr.sh). El APK de prueba se firma
#   con la misma llave del APK publicado (secretos APK_KEYSTORE_*) para que Android verifique el App Link con assetlinks.json;
#   la llave solo existe en el paso "Firmar" y se borra al terminar. Ese APK no se publica: solo se instala en el emulador.
# prueba = camara: cámara Witt (v2.2, plugin propio con CameraX y ML Kit empaquetado) abierta directo desde Escanear, ajustes,
#   colores verde/amarillo/rojo con imágenes SINTÉTICAS de assets/witt-prueba (solo en este APK de prueba) y fps (app-nativa-prueba/camara.sh).

on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Qué probar: critica (escáner, atrás, sin red), qr (ligas para unirse con la cámara del teléfono) o camara (cámara Witt)"
        type: choice
        options:
          - critica
          - qr
          - camara
        default: critica

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      URL_PRUEBA: https://juannvazquez7502-a11y.github.io/inventarios-witt/prueba-nativa/
      PRUEBA: ${{ inputs.prueba || 'critica' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Revisar la sintaxis del guion de la prueba
        run: bash -n "app-nativa-prueba/$PRUEBA.sh"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Versión de prueba
        run: |
          echo "VERSION_CODE=$((900 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.0.0-prueba" >> "$GITHUB_ENV"

      - name: Proyecto de prueba (server.url = /prueba-nativa/)
        working-directory: app-nativa
        run: |
          # La copia sin internet se arma con la página de prueba (con nativa.js); index.html del repo NO se cambia (solo en esta máquina).
          cp ../prueba-nativa/index.html ../index.html
          # errorPath igual a <scope del service worker de prueba>/sin-conexion.html, como en la app real (/inventarios-witt/).
          # webContentsDebuggingEnabled: el APK firmado de la prueba qr es de "release" y sin esto no se podría leer la página (CDP).
          jq --arg u "$URL_PRUEBA" '.server.url = $u | .server.errorPath = "inventarios-witt/prueba-nativa/sin-conexion.html" | .android.webContentsDebuggingEnabled = true' capacitor.config.json > c.json && mv c.json capacitor.config.json
          cat capacitor.config.json
          npm ci --no-audit --no-fund
          node scripts/preparar-www.mjs
          mkdir -p www/inventarios-witt/prueba-nativa && cp www/inventarios-witt/sin-conexion.html www/inventarios-witt/prueba-nativa/sin-conexion.html
          npx cap add android
          node scripts/recursos.mjs
          npx capacitor-assets generate --android --iconBackgroundColor "#00574a" --iconBackgroundColorDark "#00574a" --splashBackgroundColor "#00574a" --splashBackgroundColorDark "#00574a"
          # Imágenes sintéticas para probar la cámara Witt sin cámara real: SOLO en la prueba camara (el APK publicado no las trae).
          if [ "$PRUEBA" = camara ]; then export WITT_CAMARA_PRUEBA=1; fi
          node scripts/ajustar-android.mjs
          npx cap sync android
          grep -c "witt-nativa" www/inventarios-witt/sin-conexion.html || true

      - name: Compilar (depuración)
        working-directory: app-nativa/android
        run: |
          chmod +x gradlew
          # camara: también arma el de release (sin firmar, no se instala) para comprobar que compila con lintVital, como en app-nativa.yml.
          if [ "$PRUEBA" = qr ] || [ "$PRUEBA" = camara ]; then ./gradlew assembleRelease assembleDebug --no-daemon; else ./gradlew assembleDebug --no-daemon; fi
          mkdir -p ../../apks/debug && cp app/build/outputs/apk/debug/*.apk ../../apks/debug/
          grep -n -A9 'autoVerify' app/src/main/AndroidManifest.xml || echo "sin App Link en el manifiesto"
          grep -rn -A3 'witt-liga-vieja\|FLAG_ACTIVITY_LAUNCHED_FROM_HISTORY' app/src/main/java/ || echo "MainActivity sin el arreglo de la liga vieja"

      # Solo prueba qr. Igual que en app-nativa.yml: la contraseña va por variable de entorno y la llave se borra al terminar.
      - name: Firmar con la llave del APK (prueba qr)
        if: ${{ env.PRUEBA == 'qr' }}
        env:
          KS_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_PASS_RAW: ${{ secrets.APK_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS_RAW" ]; then echo "::error::Faltan los secretos APK_KEYSTORE_B64 / APK_KEYSTORE_PASS."; exit 1; fi
          trap 'rm -f android.keystore alineado.apk' EXIT
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > android.keystore
          KS_PASS=$(printf '%s' "$KS_PASS_RAW" | tr -d '\r\n'); export KS_PASS
          echo "::add-mask::$KS_PASS"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIN=$(ls app-nativa/android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p apks/firmada capturas
          "$BT/zipalign" -f -p 4 "$SIN" alineado.apk
          "$BT/apksigner" sign --ks android.keystore --ks-type PKCS12 --ks-pass env:KS_PASS --key-pass env:KS_PASS --out apks/firmada/prueba-qr.apk alineado.apk
          "$BT/apksigner" verify --print-certs apks/firmada/prueba-qr.apk | grep -iE "SHA-256" | tee capturas/huella-apk-prueba.txt
          curl -fsSL https://juannvazquez7502-a11y.github.io/.well-known/assetlinks.json | tee capturas/assetlinks.json

      - name: APK publicados (TWA y nativa firmada) para la prueba de actualización
        if: ${{ env.PRUEBA == 'critica' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download apk-v1.0.1-6 --repo "$GITHUB_REPOSITORY" -p "*.apk" -D apks/twa || true
          T=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName --jq '[.[].tagName | select(startswith("app-nativa-v"))][0]')
          echo "nativa firmada: $T"
          gh release download "$T" --repo "$GITHUB_REPOSITORY" -p "*.apk" -D apks/release || true
          ls -la apks/*

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bloquear supabase.co (DNS propio para el emulador)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsmasq-base dnsutils
          sudo dnsmasq --listen-address=127.0.0.2 --bind-interfaces --port=53 --no-resolv --no-hosts \
            --server=8.8.8.8 --server=1.1.1.1 \
            --address=/supabase.co/0.0.0.0 --address=/supabase.co/:: --address=/supabase.in/0.0.0.0 --address=/supabase.in/:: \
            --log-queries --log-facility=/tmp/dns.log --pid-file=/tmp/dnsmasq.pid
          sleep 1
          test "$(dig +short @127.0.0.2 prueba.supabase.co)" = "0.0.0.0"
          test -n "$(dig +short @127.0.0.2 juannvazquez7502-a11y.github.io)"

      - name: Emulador (Android 15 con Play Store)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d   # v2.38.0
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -dns-server 127.0.0.2
          script: bash "app-nativa-prueba/$PRUEBA.sh"

      - name: Registro de DNS
        if: always()
        run: |
          mkdir -p capturas
          sudo cat /tmp/dns.log | grep -iE "supabase" | sed -E 's/^.*dnsmasq\[[0-9]+\]: //' | sort | uniq -c > capturas/dns-supabase-bloqueado.txt || true
          sudo kill "$(cat /tmp/dnsmasq.pid)" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-prueba-${{ env.PRUEBA }}
          path: capturas/
          retention-days: 7
