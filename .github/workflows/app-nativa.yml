name: App nativa (Capacitor)

# App de Android "de verdad": el mismo código web dentro de Capacitor, con escáner de Google a pantalla completa,
# vibración nativa y pantalla encendida. Abre la página publicada en GitHub Pages (se actualiza sola) y trae una
# copia local por si no hay internet. Mismo paquete y misma llave que el APK TWA: se instala ENCIMA como actualización.
# El flujo del TWA (apk.yml) no se toca.
#
# Seguridad: el token de GitHub solo puede LEER en los trabajos que corren dependencias de npm, Gradle o la acción del
# emulador (y checkout no lo deja guardado). Solo el trabajo "publicar", que no corre código de terceros, puede escribir
# (crear el Release). Las dependencias se instalan con npm ci desde package-lock.json (versiones y hashes fijos) y la
# acción del emulador va fijada por SHA.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión visible (por ejemplo 2.0.0)"
        required: true
        default: "2.0.0"
      publicar:
        description: "Publicar el APK en Releases"
        type: boolean
        default: true
      emulador:
        description: "Probar en el emulador (capturas de pantalla)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.nombre.outputs.tag }}
      version_code: ${{ steps.nombre.outputs.version_code }}
    defaults:
      run:
        working-directory: app-nativa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El Android SDK ya viene en ubuntu-latest (ANDROID_HOME); Gradle baja lo que falte (API 35).

      - name: Versión
        id: nombre
        env:
          VN: ${{ inputs.version }}
        run: |
          case "$VN" in ''|*[!0-9A-Za-z.-]*) echo "::error::Versión no válida: $VN"; exit 1;; esac
          VC=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "tag=app-nativa-v$VN-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "versionCode $VC · versionName $VN"

      - name: Dependencias (npm ci, versiones fijas del package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Copia local (www)
        run: node scripts/preparar-www.mjs

      - name: Íconos y splash
        run: |
          npx cap add android
          node scripts/recursos.mjs

      - name: Proyecto Android
        run: |
          echo "verde del ícono: $VERDE_ICONO"
          npx capacitor-assets generate --android --iconBackgroundColor "$VERDE_ICONO" --iconBackgroundColorDark "$VERDE_ICONO" --splashBackgroundColor "$VERDE_ICONO" --splashBackgroundColorDark "$VERDE_ICONO"
          node scripts/ajustar-android.mjs
          npx cap sync android

      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      # La llave y su contraseña solo existen en este paso: la contraseña va por variable de entorno (env:KS_PASS),
      # no en la línea de comandos, y la llave se borra al terminar.
      - name: Firmar
        env:
          KS_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_PASS_RAW: ${{ secrets.APK_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS_RAW" ]; then
            echo "::error::Faltan los secretos APK_KEYSTORE_B64 / APK_KEYSTORE_PASS: sin la misma llave no se instala encima del TWA."
            exit 1
          fi
          trap 'rm -f android.keystore alineado.apk' EXIT
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > android.keystore
          KS_PASS=$(printf '%s' "$KS_PASS_RAW" | tr -d '\r\n'); export KS_PASS
          echo "::add-mask::$KS_PASS"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          NOMBRE="Inventarios-Witt-nativa-$VERSION_NAME.apk"
          mkdir -p salida/release salida/debug
          "$BT/zipalign" -f -p 4 "$SIN" alineado.apk
          "$BT/apksigner" sign --ks android.keystore --ks-type PKCS12 --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "salida/release/$NOMBRE" alineado.apk
          "$BT/apksigner" verify --print-certs "salida/release/$NOMBRE" | tee salida/huella.txt
          "$BT/aapt2" dump badging "salida/release/$NOMBRE" | grep -E "^package|uses-permission|sdkVersion|application-label:" | tee salida/paquete.txt
          cp android/app/build/outputs/apk/debug/*.apk "salida/debug/Inventarios-Witt-nativa-$VERSION_NAME-depuracion.apk"
          ls -la salida/release salida/debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-nativa-apk
          path: |
            app-nativa/salida/release/*.apk
            app-nativa/salida/huella.txt
            app-nativa/salida/paquete.txt

      - uses: actions/upload-artifact@v4
        with:
          name: app-nativa-depuracion
          path: app-nativa/salida/debug/*.apk
          retention-days: 7

  # Único trabajo con permiso de escritura: no instala dependencias ni corre código del proyecto; solo baja el APK
  # firmado del trabajo anterior y crea el Release con gh (que ya viene en ubuntu-latest).
  publicar:
    needs: apk
    if: ${{ inputs.publicar }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-nativa-apk
          path: salida

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.apk.outputs.tag }}
          VC: ${{ needs.apk.outputs.version_code }}
          VN: ${{ inputs.version }}
        run: |
          find salida -type f -print
          APK=$(find salida -name '*.apk' | head -1)
          test -n "$APK"
          # Pre-release: no reemplaza al APK TWA como "Latest" hasta que la página publicada traiga la capa nativa.js.
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "App nativa $VN (versionCode $VC)" \
            --notes "App de Android nativa (Capacitor) de Inventarios Grupo Witt: escáner de Google a pantalla completa, vibración nativa y pantalla encendida. Abre la versión publicada en GitHub Pages y trae una copia por si no hay internet. Mismo paquete y misma llave que el APK anterior (TWA): se instala encima como actualización. Antes de actualizar, sube los pendientes: los datos guardados en Chrome no pasan a la app nueva. El escáner, la vibración y la pantalla encendida se activan cuando la página publicada incluye la capa nativa (nativa.js)."

  emulador:
    needs: apk
    if: ${{ inputs.emulador }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: app-nativa-apk
          path: apks/release

      - uses: actions/download-artifact@v4
        with:
          name: app-nativa-depuracion
          path: apks/debug

      - name: Ordenar APK
        run: |
          find apks -name '*.apk' -print
          f=$(find apks/release -name '*.apk' | head -1); [ "$(dirname "$f")" != apks/release ] && mv "$f" apks/release/ || true
          ls -la apks/release apks/debug

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bloquear supabase.co (DNS propio para el emulador)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsmasq-base dnsutils
          sudo dnsmasq --listen-address=127.0.0.2 --bind-interfaces --port=53 --no-resolv --no-hosts \
            --server=8.8.8.8 --server=1.1.1.1 \
            --address=/supabase.co/0.0.0.0 --address=/supabase.co/:: --address=/supabase.in/0.0.0.0 --address=/supabase.in/:: \
            --log-queries --log-facility=/tmp/dns.log --pid-file=/tmp/dnsmasq.pid
          sleep 1
          dig +short @127.0.0.2 juannvazquez7502-a11y.github.io | head -3
          echo "supabase -> $(dig +short @127.0.0.2 prueba.supabase.co)"
          test "$(dig +short @127.0.0.2 prueba.supabase.co)" = "0.0.0.0"
          test -n "$(dig +short @127.0.0.2 juannvazquez7502-a11y.github.io)"

      # Imagen con Play Store: el escáner de Google (ML Kit) se descarga por los servicios de Google Play, como en un teléfono.
      # Acción de terceros fijada por SHA (v2.38.0).
      - name: Emulador (Android 15)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -dns-server 127.0.0.2
          script: bash app-nativa/scripts/prueba-emulador.sh

      - name: Registro de DNS (supabase bloqueado)
        if: always()
        run: |
          mkdir -p capturas
          sudo cat /tmp/dns.log | grep -iE "supabase" | sed -E 's/^.*dnsmasq\[[0-9]+\]: //' | sort | uniq -c > capturas/dns-supabase-bloqueado.txt || true
          sudo cat /tmp/dns.log | grep -E "query\[" | sed -E 's/^.*query\[[A-Z]+\] ([^ ]+).*/\1/' | sort | uniq -c | sort -rn > capturas/dns-consultas.txt || true
          sudo kill "$(cat /tmp/dnsmasq.pid)" || true
          ls -la capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-emulador
          path: capturas/
